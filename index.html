<!DOCTYPE html>
<html>
<head>
  <title>Spring Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#efeae2; }

    #login {
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:#111b21;
      color:white;
    }

    input, button {
      padding:10px;
      margin:5px;
      border-radius:5px;
      border:none;
      font-size:16px;
    }

    button {
      background:#00a884;
      color:white;
      cursor:pointer;
    }

    #chat {
      display:none;
      height:100vh;
      flex-direction:column;
    }

    #header {
      background:#00a884;
      color:white;
      padding:12px;
      text-align:center;
      font-weight:bold;
    }

    #messages {
      flex:1;
      padding:10px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
    }

    .msg {
      padding:10px;
      margin:5px;
      border-radius:10px;
      max-width:70%;
      word-wrap:break-word;
      font-size:14px;
    }

    .me { background:#d9fdd3; align-self:flex-end; }
    .other { background:white; align-self:flex-start; }

    #inputBox {
      display:flex;
      padding:10px;
      background:#f0f0f0;
    }

    #msg {
      flex:1;
      border:none;
      border-radius:20px;
      padding:10px;
      outline:none;
    }

    #typing {
      font-size:12px;
      color:gray;
      padding-left:10px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>🔐 Login</h2>
  <input id="name" placeholder="Your Name">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Enter</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="header">💬 Private Chat</div>
  <div id="typing"></div>
  <div id="messages"></div>

  <div id="inputBox">
    <input id="msg" placeholder="Type message...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
/* 🔥 PASSWORD */
const PASSWORD = "09049495";

/* 🔥 FIREBASE CONFIG (PUT YOURS) */
const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  databaseURL: "XXXX",
  projectId: "XXXX"
};

/* INIT FIREBASE */
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("chat");

/* GLOBAL SAFE STATE */
let username = null;
let chatStarted = false;

/* LOGIN */
function login(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(pass !== PASSWORD || !name.trim()){
    alert("Wrong details");
    return;
  }

  username = name.trim();

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";

  if(!chatStarted){
    startChat();
    chatStarted = true;
  }
}

/* SEND MESSAGE */
function send(){
  const input = document.getElementById("msg");
  const text = input.value;

  if(!text.trim() || !username) return;

  db.push({
    user: username,
    text: text,
    time: Date.now()
  });

  input.value = "";
}

/* REALTIME CHAT */
function startChat(){
  db.on("child_added", (snap) => {
    const data = snap.val();
    if(!data) return;

    const cls = (data.user === username) ? "me" : "other";

    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerHTML = `<b>${data.user}</b><br>${data.text}`;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}

/* TYPING */
document.getElementById("msg").addEventListener("input", () => {
  if(!username) return;

  document.getElementById("typing").innerText = username + " is typing...";

  clearTimeout(window.typingTimer);
  window.typingTimer = setTimeout(() => {
    document.getElementById("typing").innerText = "";
  }, 1000);
});
</script>

</body>
</html>
