<!DOCTYPE html>
<html>
<head>
  <title>Java Spring Boot..</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    body { margin:0; font-family:Arial; background:#efeae2; }

    #login {
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:#111b21;
      color:white;
    }

    input, button {
      padding:10px;
      margin:5px;
      border-radius:5px;
      border:none;
      font-size:16px;
    }

    button {
      background:#00a884;
      color:white;
      cursor:pointer;
    }

    #chat {
      display:none;
      height:100vh;
      flex-direction:column;
    }

    #header {
      background:#00a884;
      color:white;
      padding:12px;
      text-align:center;
      font-weight:bold;
    }

    #messages {
      flex:1;
      padding:10px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
    }

    .msg {
      padding:10px;
      margin:5px;
      border-radius:10px;
      max-width:70%;
      word-wrap:break-word;
      font-size:14px;
    }

    .me { background:#d9fdd3; align-self:flex-end; }
    .other { background:white; align-self:flex-start; }

    #inputBox {
      display:flex;
      padding:10px;
      background:#f0f0f0;
    }

    #msg {
      flex:1;
      border:none;
      border-radius:20px;
      padding:10px;
      outline:none;
    }

    #typing {
      font-size:12px;
      color:gray;
      padding-left:10px;
    }
  </style>
</head>

<body>

<div id="login">
  <h2>🔐 Login</h2>
  <input id="name" placeholder="Your Name">
<input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Enter</button>
</div>

<div id="chat">
 <div id="header">
  💬 Java Study Notes Group  chat
 <button id="deleteBtn" onclick="deleteChat()" style="
  float:right;
  background:#ff3b3b;
  padding:5px 10px;
  font-size:12px;
  border-radius:5px;
  display:none;   /* hidden by default */
">
  🗑 Delete Chat
</button>
</div>
  <div id="typing"></div>
  <div id="messages"></div>
  <div id="replyBox" style="
  display:none;
  padding:6px 10px;
  background:#e0f2f1;
  font-size:13px;
  border-left:4px solid #00a884;
">
  <span id="replyText"></span>
  <span style="float:right;cursor:pointer;" onclick="cancelReply()">✖</span>
</div>

  <div id="inputBox">
    <input id="msg" placeholder="Type message...">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
let replyTo = null; // { user, text }
const PASSWORD = "93052";

// 🔥 IMPORTANT: MUST HAVE databaseURL
const firebaseConfig = {
  apiKey: "AIzaSyARiLE2-KrHZJwInwnBFHvAt-VJDTFxuaI",
  authDomain: "java-notes-67e75.firebaseapp.com",
  databaseURL: "https://java-notes-67e75-default-rtdb.firebaseio.com",
  projectId: "java-notes-67e75",
  storageBucket: "java-notes-67e75.firebasestorage.app",
  messagingSenderId: "961074785783",
  appId: "1:961074785783:web:35f8da4f5bd3a272b612f2"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database().ref("chat");

let username = "";
function login(){
  const p = document.getElementById("pass").value;
  const n = document.getElementById("name").value;

  if(p !== PASSWORD || !n.trim()){
    alert("Wrong details");
    return;
  }

  username = n.trim();
  const SUPER_USERS = ["admin"];   
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "flex";
  
   if (SUPER_USERS.includes(username.toLowerCase())) {
    document.getElementById("deleteBtn").style.display = "inline-block";
  }

  startChat();
}

/* SEND */
function send(){
  const input = document.getElementById("msg");
  const m = input.value;

  if(!m.trim()) return;

  db.push({
    user: username,
    text: m,
    time: Date.now()
	replyTo: replyTo 
  });

  input.value = "";
}

function cancelReply(){
  replyTo = null;
  document.getElementById("replyBox").style.display = "none";
}

function formatTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

/* REALTIME LISTENER (FIXED) */
function startChat(){
  db.off();

  db.on("child_added", snap => {
    const d = snap.val();
    if(!d) return;

    const cls = (d.user === username) ? "me" : "other";
    const time = d.time ? formatTime(d.time) : "";

    const div = document.createElement("div");
    div.className = "msg " + cls;
	
	div.onclick = () => {
  replyTo = { user: d.user, text: d.text };
  document.getElementById("replyText").innerText =
    "Replying to " + d.user + ": " + d.text.substring(0, 40);
  document.getElementById("replyBox").style.display = "block";
};

   div.innerHTML = `
  <b>${d.user}</b>
  <div style="font-size:11px;color:#888;text-align:right;">
    ${time}
  </div>
  <br>
  ${d.replyTo ? `
  <div style="
    font-size:12px;
    padding:4px;
    background:#f1f1f1;
    border-left:3px solid #00a884;
    margin-bottom:4px;
  ">
    <b>${d.replyTo.user}</b>: ${d.replyTo.text}
  </div>
` : ""}

${linkify(d.text)}
`;

    const box = document.getElementById("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return text.replace(urlRegex, function(url) {
    return `<a href="${url}" target="_blank" style="color:#4da3ff;">${url}</a>`;
  });
}

/* TYPING */
document.getElementById("msg").addEventListener("input", () => {
  if(!username) return;

  document.getElementById("typing").innerText = username + " is typing...";

  clearTimeout(window.typingTimer);
  window.typingTimer = setTimeout(() => {
    document.getElementById("typing").innerText = "";
  }, 1000);
});

function deleteChat(){
  if(!confirm("Are you sure you want to delete ALL chat history?")){
    return;
  }

  db.remove()
    .then(() => {
      document.getElementById("messages").innerHTML = "";
      alert("Chat history deleted successfully");
    })
    .catch(err => {
      alert("Error deleting chat");
      console.error(err);
    });
}
  
</script>

</body>
</html>
